<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>

    <!-- Google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- DaisyUl and Tailwind css -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awsome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="geist ">

    <section class="login-page w-full max-w-sm mx-auto mt-[80px] mb-[80px]">

        <form class="fieldset  border-base-300 rounded-box w-xs border p-4 shadow-lg">
            <div class="flex flex-col text-center items-center">
                <img src="assets/github-logo.png" alt="" class="w-28 h-28 mb-6">
                <h1 class="text-[#1F2937] font-semibold text-2xl">GitHub Issues Tracker</h1>
                <p class="text-[#64748B]">Sign in to manage your issues</p>
            </div>
            <fieldset class="fieldset">
                <label class="label font-bold text-black">Username</label>
                <input id="inputUser" type="text" class="input validator" placeholder="Enter Username" required />
                <p class="validator-hint hidden">Required</p>
                <p class="text-[#4A00FF] font-medium text-xs">Default: admin</p>
            </fieldset>

            <label class="fieldset">
                <span class="label font-bold text-black">Password</span>
                <input id="inputPass" type="password" class="input validator" placeholder="Enter Password" required />
                <span class="validator-hint hidden">Required</span>
                <p class="text-[#4A00FF] font-medium text-xs">Default: admin123</p>
            </label>

            <button id="sign-btn" class="btn btn-primary mt-4" type="submit">Sign In</button>

            <div class="divider text-[#1F2937] mt-[10px] font-semibold">OR</div>

            <div class="text-center">
                <p class="text-base-content/60 font-semibold text-[14px] mb-2">
                    Demo Credentials:
                </p>
                <div class=" flex items-center justify-center bg-base-200">
                    <div class="card bg-transparent p-6 text-center w-full">

                        <p class="text-[16px]">
                            <span class="font-bold">Username:</span> admin
                        </p>

                        <p class="text-[16px]">
                            <span class="font-bold">Password:</span> admin123
                        </p>

                    </div>
                </div>
            </div>

        </form>

    </section>

    <script src="script/login.js"></script>

</body>

</html>
